<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Monochrome Remote Server Loader</title>
    <style>
        :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0b0b0c; color: #f4f4f5; }
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; }
        body { position: relative; }
        iframe { display: block; width: 100%; height: 100%; border: 0; background: #0b0b0c; }

        #switcher {
            position: fixed;
            top: .6rem;
            right: .6rem;
            z-index: 10;
            display: flex;
            gap: .4rem;
        }
        #switcher button {
            border: 1px solid #44444d;
            border-radius: .5rem;
            background: rgba(36, 36, 42, .85);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            color: inherit;
            padding: .45rem .7rem;
            font: inherit;
            font-size: .85rem;
            cursor: pointer;
            box-shadow: 0 2px 10px rgba(0,0,0,.35);
        }
        #switcher button:hover,
        #switcher button[aria-pressed="true"] { background: #f4f4f5; color: #17171a; border-color: #f4f4f5; }
    </style>
</head>
<body>
    <iframe id="server-frame" title="Monochrome" allow="autoplay; fullscreen; picture-in-picture"></iframe>

    <div id="switcher">
        <button type="button" data-server="2">Server 2 · if-it-runs-ship-it.lol</button>
        <button type="button" data-server="3">Server 3 · monochrome.samidy.com</button>
    </div>

    <script>
        const servers = {
            2: { label: 'Server 2 · if-it-runs-ship-it.lol', url: 'https://if-it-runs-ship-it.lol/' },
            3: { label: 'Server 3 · monochrome.samidy.com', url: 'https://monochrome.samidy.com/' },
        };

        const frame = document.getElementById('server-frame');
        const buttons = document.querySelectorAll('[data-server]');

        function loadServer(id, updateUrl = true) {
            const server = servers[id] || servers[2];
            const activeId = servers[id] ? id : '2';
            frame.src = server.url;
            frame.title = server.label;
            buttons.forEach((button) => button.setAttribute('aria-pressed', button.dataset.server === activeId));
            if (updateUrl) {
                const url = new URL(window.location);
                url.searchParams.set('server', activeId);
                history.replaceState(null, '', url);
            }
        }

        buttons.forEach((button) => button.addEventListener('click', () => loadServer(button.dataset.server)));
        loadServer(new URLSearchParams(window.location.search).get('server') || '2', false);
    </script>
</body>
</html>
